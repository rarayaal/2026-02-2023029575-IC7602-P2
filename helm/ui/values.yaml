replicaCount: 1

image:
  repository: zonal-cache-ui
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  # nodePort: 30080 # Opcional si type es NodePort

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
