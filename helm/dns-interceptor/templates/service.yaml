apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dns-interceptor
  labels:
    app: dns-interceptor
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
  selector:
    app: dns-interceptor
