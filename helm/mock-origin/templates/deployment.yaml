apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-origin
  labels:
    app: mock-origin
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mock-origin
  template:
    metadata:
      labels:
        app: mock-origin
    spec:
      containers:
        - name: mock-origin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-origin
  labels:
    app: mock-origin
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: mock-origin
