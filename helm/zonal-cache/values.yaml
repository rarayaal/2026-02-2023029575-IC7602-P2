replicaCount: 1

image:
  repository: zonal-cache
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: cache.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zonal-cache-tls
      hosts:
        - cache.local

env:
  PORT: "8080"
  CACHE_DIR: "/var/cache/zonal-cache"
  ORIGIN_HOST: "apache-service"
  ORIGIN_PORT: "80"
  AUTH_MODE: "api_key"
  AUTH_UI_URL: "http://ui-service:5173/login"
  CONFIG_API_URL: "http://node-api-service:3000"
  CONFIG_API_TOKEN: ""
  EXPECTED_API_KEY: ""

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /var/cache/zonal-cache

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi
