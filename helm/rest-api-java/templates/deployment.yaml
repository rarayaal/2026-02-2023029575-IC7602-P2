apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rest-api-java
  labels:
    app: rest-api-java
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rest-api-java
  template:
    metadata:
      labels:
        app: rest-api-java
    spec:
      containers:
        - name: rest-api-java
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: REST_API_HOST
              value: {{ .Values.env.restApiHost | quote }}
            - name: REST_API_PORT
              value: {{ .Values.env.restApiPort | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}